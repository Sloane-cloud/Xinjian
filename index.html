<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FAFAF7">
<meta name="description" content="信笺 - 属于你的私人数字空间">
<title>信笺</title>
<style>
/* ========== base ========== */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 16px; line-height: 1.5; color: var(--color-text); background: var(--color-bg);
  -webkit-font-smoothing: antialiased; overscroll-behavior: none; transition: background 250ms ease, color 250ms ease;
}
#app { height: 100dvh; display: flex; flex-direction: column; }
button { font-family: inherit; font-size: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea { font-family: inherit; font-size: inherit; color: inherit; border: none; outline: none; background: transparent; }
svg { display: block; }

/* ========== theme ========== */
:root {
  --color-bg: #FAFAF7; --color-surface: #FFFFFF; --color-surface-hover: #F5F5F2;
  --color-text: #1C1C1E; --color-text-secondary: #6E6E73; --color-text-tertiary: #AEAEB2;
  --color-border: #E8E8E3; --color-primary: #5B7B7A; --color-primary-light: #E8F0EF;
  --color-accent: #C9A8A2; --color-danger: #C75C5C; --color-success: #6B9E7C;
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-full: 999px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.03); --shadow-md: 0 2px 8px rgba(0,0,0,0.05);
  --space-xs: 4px; --space-sm: 8px; --space-md: 16px; --space-lg: 24px; --space-xl: 32px;
  --nav-height: 56px; --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  --transition-fast: 150ms ease; --transition-base: 250ms ease;
}
[data-theme="dark"] {
  --color-bg: #121212; --color-surface: #1C1C1E; --color-surface-hover: #2C2C2E;
  --color-text: #F2F2F7; --color-text-secondary: #98989F; --color-text-tertiary: #636366;
  --color-border: #2C2C2E; --color-primary: #7BA3A1; --color-primary-light: #1E2E2D;
  --color-accent: #D4B8B3; --shadow-sm: 0 1px 2px rgba(0,0,0,0.2); --shadow-md: 0 2px 8px rgba(0,0,0,0.3);
}

/* ========== layout ========== */
.page-container { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-top: var(--safe-top); padding-bottom: calc(var(--nav-height) + var(--safe-bottom)); }
.page { min-height: 100%; padding: var(--space-md); }
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; height: calc(var(--nav-height) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom); display: flex; align-items: stretch;
  background: var(--color-surface); border-top: 1px solid var(--color-border); z-index: 100;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--color-text-tertiary); transition: color var(--transition-fast); min-height: 44px; }
.nav-item.active { color: var(--color-primary); }
.nav-item:active { opacity: 0.7; }
.nav-icon svg { width: 22px; height: 22px; }
.nav-label { font-size: 11px; line-height: 1; }

/* ========== components ========== */
.btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 20px; border-radius: var(--radius-md); font-size: 15px; font-weight: 500; min-height: 44px; }
.btn:active { opacity: 0.85; }
.btn-primary { background: var(--color-primary); color: #fff; }
.btn-secondary { background: var(--color-surface-hover); color: var(--color-text); }
.btn-text { background: none; color: var(--color-primary); padding: 8px 12px; min-height: auto; }

.toast-root { position: fixed; bottom: calc(var(--nav-height) + var(--safe-bottom) + 24px); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 2000; pointer-events: none; }
.toast { background: rgba(0,0,0,0.85); color: #fff; padding: 10px 18px; border-radius: var(--radius-full); font-size: 14px; opacity: 0; transform: translateY(10px); transition: all 250ms ease; max-width: 80%; text-align: center; }
.toast.show { opacity: 1; transform: translateY(0); }
.toast-error { background: var(--color-danger); }
.toast-success { background: var(--color-success); }

.modal-root { position: fixed; inset: 0; pointer-events: none; z-index: 1500; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; padding: 24px; opacity: 0; transition: opacity 250ms ease; pointer-events: auto; }
.modal-overlay.show { opacity: 1; }
.modal { background: var(--color-surface); border-radius: var(--radius-lg); padding: 24px; width: 100%; max-width: 320px; transform: scale(0.95); transition: transform 250ms ease; box-shadow: var(--shadow-lg); }
.modal-overlay.show .modal { transform: scale(1); }
.modal-title { font-size: 17px; font-weight: 600; margin-bottom: 16px; text-align: center; }
.modal-body { margin-bottom: 20px; }
.modal-actions { display: flex; gap: 10px; }
.modal-actions .btn { flex: 1; }
.input-group { margin-bottom: 12px; }
.input-group label { display: block; font-size: 13px; color: var(--color-text-secondary); margin-bottom: 6px; }
.input-group input { width: 100%; padding: 10px 14px; background: var(--color-surface-hover); border-radius: var(--radius-md); font-size: 15px; }

/* ========== pages ========== */
.page-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; color: var(--color-text-secondary); gap: var(--space-md); text-align: center; }
.placeholder-icon { width: 48px; height: 48px; color: var(--color-text-tertiary); }
.placeholder-icon svg { width: 48px; height: 48px; }
.placeholder-text { font-size: 15px; color: var(--color-text-secondary); }

/* 首页 */
.home-page { display: flex; flex-direction: column; min-height: 80vh; padding-top: var(--space-xl); }
.home-profile { display: flex; align-items: center; justify-content: center; gap: var(--space-lg); margin-bottom: var(--space-xl); }
.home-avatar { width: 72px; height: 72px; border-radius: 50%; background: var(--color-surface-hover); display: flex; align-items: center; justify-content: center; overflow: hidden; border: 2px solid var(--color-border); }
.home-avatar svg { width: 36px; height: 36px; color: var(--color-text-tertiary); }
.home-heart { font-size: 24px; color: var(--color-accent); animation: breathe 3s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { opacity: 0.6; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.05); } }
.home-names { text-align: center; margin-bottom: var(--space-xl); }
.home-name-row { display: flex; justify-content: center; gap: var(--space-lg); margin-bottom: var(--space-sm); }
.home-name { font-size: 16px; font-weight: 500; color: var(--color-text); }
.home-name.sub { color: var(--color-text-secondary); font-weight: 400; }
.home-status { font-size: 13px; color: var(--color-text-secondary); }

.home-cards { display: flex; flex-direction: column; gap: var(--space-md); padding: 0 var(--space-md); }
.home-card { background: var(--color-surface); border-radius: var(--radius-lg); padding: var(--space-lg); box-shadow: var(--shadow-sm); border: 1px solid var(--color-border); transition: transform var(--transition-fast); }
.home-card:active { transform: scale(0.98); }
.home-card-title { font-size: 15px; font-weight: 600; color: var(--color-text); margin-bottom: 6px; }
.home-card-desc { font-size: 13px; color: var(--color-text-secondary); line-height: 1.5; }

.debug-panel { position: fixed; top: calc(var(--safe-top) + 8px); right: 8px; z-index: 500; display: flex; gap: 6px; }
.debug-btn { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-full); padding: 6px 12px; font-size: 12px; color: var(--color-text-secondary); }
</style>
</head>
<body>

<div id="app" class="app">
  <main id="page-container" class="page-container"></main>
  <nav id="bottom-nav" class="bottom-nav"></nav>
</div>

<div class="debug-panel">
  <button class="debug-btn" id="debug-theme">主题</button>
  <button class="debug-btn" id="debug-lang">语言</button>
  <button class="debug-btn" id="debug-edit">编辑资料</button>
</div>

<div id="modal-root" class="modal-root"></div>
<div id="toast-root" class="toast-root"></div>

<script>
(function () {
  'use strict';

  /* ================= Utils ================= */
  var Utils = {
    generateId: function (p) { return (p||'') + Date.now().toString(36) + Math.random().toString(36).slice(2,6); },
    escapeHtml: function (s) { if (s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  };

  /* ================= I18n ================= */
  var TR = {
    zh: { 'app.name':'信笺','nav.home':'首页','nav.chat':'聊天','nav.cards':'字卡库','nav.profile':'我的','home.subtitle':'属于你的私人空间','home.card.dynamic':'动态','home.card.dynamic.desc':'还没有动态，记录第一份回忆吧','home.card.letter':'信件','home.card.letter.desc':'写下一封属于你的信吧','edit.title':'编辑资料','edit.myName':'我的昵称','edit.taName':'TA的昵称','edit.status':'状态','edit.save':'保存','edit.cancel':'取消','page.soon':'即将开启' },
    en: { 'app.name':'Xinjian','nav.home':'Home','nav.chat':'Chat','nav.cards':'Cards','nav.profile':'Me','home.subtitle':'Your private space','home.card.dynamic':'Moments','home.card.dynamic.desc':'No moments yet. Record your first memory.','home.card.letter':'Letters','home.card.letter.desc':'Write a letter of your own.','edit.title':'Edit Profile','edit.myName':'My Name','edit.taName':'TA Name','edit.status':'Status','edit.save':'Save','edit.cancel':'Cancel','page.soon':'Coming soon' },
    es: { 'app.name':'Xinjian','nav.home':'Inicio','nav.chat':'Chat','nav.cards':'Tarjetas','nav.profile':'Yo','home.subtitle':'Tu espacio privado','home.card.dynamic':'Momentos','home.card.dynamic.desc':'Sin momentos. Graba tu primer recuerdo.','home.card.letter':'Cartas','home.card.letter.desc':'Escribe una carta tuya.','edit.title':'Editar Perfil','edit.myName':'Mi Nombre','edit.taName':'Nombre TA','edit.status':'Estado','edit.save':'Guardar','edit.cancel':'Cancelar','page.soon':'Próximamente' }
  };
  var I18n = {
    current: 'zh',
    setLanguage: function (l) { if (TR[l]) { this.current = l; document.documentElement.lang = l; } },
    t: function (k) { return (TR[this.current]&&TR[this.current][k]) || (TR.zh&&TR.zh[k]) || k; },
    available: function () { return Object.keys(TR); }
  };

  /* ================= Icons ================= */
  var ICONS = {
    home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>',
    chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>',
    cards: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 6V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-2"/></svg>',
    user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>'
  };
  function getIcon(n) { return ICONS[n]||''; }

  /* ================= Toast ================= */
  var Toast = {
    show: function (m, t, d) {
      t = t||'info'; d = d||2000;
      var r = document.getElementById('toast-root'); if (!r) return;
      var e = document.createElement('div'); e.className = 'toast toast-'+t; e.textContent = m; r.appendChild(e);
      requestAnimationFrame(function(){ e.classList.add('show'); });
      setTimeout(function(){ e.classList.remove('show'); setTimeout(function(){ e.remove(); },300); }, d);
    },
    info: function(m,d){ this.show(m,'info',d); },
    success: function(m,d){ this.show(m,'success',d); },
    error: function(m,d){ this.show(m,'error',d||3000); }
  };

  /* ================= Modal ================= */
  var Modal = {
    current: null,
    open: function (opts) {
      this.close();
      var r = document.getElementById('modal-root'); if (!r) return;
      var self = this;
      var o = document.createElement('div'); o.className = 'modal-overlay';
      var m = document.createElement('div'); m.className = 'modal';
      if (opts.title) { var t = document.createElement('h3'); t.className='modal-title'; t.textContent=opts.title; m.appendChild(t); }
      var b = document.createElement('div'); b.className='modal-body'; b.innerHTML=opts.content||''; m.appendChild(b);
      var a = document.createElement('div'); a.className='modal-actions';
      (opts.actions||[]).forEach(function(act){
        var btn = document.createElement('button');
        btn.className = 'btn '+(act.type||'btn-secondary');
        btn.textContent = act.label;
        btn.addEventListener('click', function(){
          if (typeof act.onClick === 'function') act.onClick();
          if (act.close !== false) self.close();
        });
        a.appendChild(btn);
      });
      m.appendChild(a); o.appendChild(m); r.appendChild(o); this.current = o;
      requestAnimationFrame(function(){ o.classList.add('show'); });
      o.addEventListener('click', function(e){ if(e.target===o) self.close(); });
    },
    close: function () {
      if (!this.current) return;
      var e = this.current; e.classList.remove('show');
      setTimeout(function(){ e.remove(); },200); this.current = null;
    }
  };

  /* ================= Database ================= */
  var DB_NAME='XinjianDB', DB_VERSION=1, dbInstance=null;
  var SCHEMA = {
    user: { keyPath:'id' }, chatSettings: { keyPath:'id' }, settings: { keyPath:'id' }, security: { keyPath:'id' },
    chatMessages: { keyPath:'id', indexes:[{name:'timestamp',keyPath:'timestamp'}] },
    cardGroups: { keyPath:'id' }, cards: { keyPath:'id' }, replyRules: { keyPath:'id' },
    dynamics: { keyPath:'id' }, letters: { keyPath:'id' }, music: { keyPath:'id' },
    translationCache: { keyPath:'id' }, backups: { keyPath:'id' }, favorites: { keyPath:'id' },
    drafts: { keyPath:'id' }, recentUsed: { keyPath:'id' }
  };
  var Database = {
    open: function () {
      if (dbInstance) return Promise.resolve(dbInstance);
      return new Promise(function(resolve,reject){
        if (!window.indexedDB) { reject(new Error('当前浏览器不支持 IndexedDB')); return; }
        var req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onerror = function(){ reject(req.error); };
        req.onsuccess = function(){
          dbInstance = req.result;
          dbInstance.onversionchange = function(){ dbInstance.close(); dbInstance=null; };
          resolve(dbInstance);
        };
        req.onupgradeneeded = function(e){
          var db = e.target.result;
          Object.keys(SCHEMA).forEach(function(n){
            var c = SCHEMA[n];
            if (!db.objectStoreNames.contains(n)) {
              var s = db.createObjectStore(n, { keyPath: c.keyPath });
              (c.indexes||[]).forEach(function(i){
                s.createIndex(i.name, i.keyPath, { unique:!!i.unique, multiEntry:!!i.multiEntry });
              });
            }
          });
        };
      });
    },
    get: function (s,k) { return this.open().then(function(db){ return new Promise(function(res,rej){ var tx=db.transaction(s,'readonly'); var r=tx.objectStore(s).get(k); r.onsuccess=function(){res(r.result);}; r.onerror=function(){rej(r.error);}; }); }); },
    put: function (s,v) { return this.open().then(function(db){ return new Promise(function(res,rej){ var tx=db.transaction(s,'readwrite'); var r=tx.objectStore(s).put(v); r.onsuccess=function(){res(r.result);}; r.onerror=function(){rej(r.error);}; }); }); }
  };

  /* ================= Storage ================= */
  function defaultSettings() {
    return { id:'settings', appearance:{ theme:'system', background:null, backgroundOpacity:1, backgroundBlur:0 }, language:'zh', notifications:{message:false,activeMessage:false}, features:{music:true,dynamic:true,letters:true}, animations:{enabled:true}, splash:{enabled:false,type:'fade',speed:'normal'}, updatedAt:Date.now() };
  }
  function defaultUser() {
    return { id:'main', myName:'我的', taName:'TA', myStatus:'在这里', taStatus:'在这里', myAvatar:null, taAvatar:null, background:null, updatedAt:Date.now() };
  }
  var Storage = {
    getSettings: function () { return Database.get('settings','settings').then(function(s){ return s||defaultSettings(); }); },
    saveSettings: function (s) { s.id='settings'; s.updatedAt=Date.now(); return Database.put('settings',s).then(function(){return s;}); },
    getUser: function () { return Database.get('user','main').then(function(u){ return u||defaultUser(); }); },
    saveUser: function (u) { u.id='main'; u.updatedAt=Date.now(); return Database.put('user',u).then(function(){return u;}); }
  };

  /* ================= State ================= */
  var State = { currentPage:'home', user:null, settings:null, theme:'light' };

  /* ================= Router ================= */
  var Router = {
    routes:{}, current:null,
    register: function(n,m){ this.routes[n]=m; },
    navigate: function(n,p){
      p = p||{}; var mod=this.routes[n]; if(!mod) return;
      var c=document.getElementById('page-container'); if(!c) return;
      c.innerHTML = typeof mod.render==='function' ? mod.render(p) : ''; c.scrollTop=0;
      if (typeof mod.mount==='function') mod.mount(c,p);
      this.current=n; State.currentPage=n; this.updateNav(n);
    },
    updateNav: function(a){
      var nav=document.getElementById('bottom-nav'); if(!nav) return;
      var items=nav.querySelectorAll('.nav-item');
      for(var i=0;i<items.length;i++) items[i].classList.toggle('active', items[i].dataset.page===a);
    }
  };

  /* ================= Modules ================= */
  var HomeModule = {
    render: function () {
      var u = State.user || defaultUser();
      return '' +
      '<div class="page home-page">' +
        '<div class="home-profile">' +
          '<div class="home-avatar">' + getIcon('user') + '</div>' +
          '<div class="home-heart">♡</div>' +
          '<div class="home-avatar">' + getIcon('user') + '</div>' +
        '</div>' +
        '<div class="home-names">' +
          '<div class="home-name-row">' +
            '<span class="home-name">' + Utils.escapeHtml(u.myName) + '</span>' +
            '<span class="home-name sub">' + Utils.escapeHtml(u.taName) + '</span>' +
          '</div>' +
          '<div class="home-status">' + Utils.escapeHtml(u.myStatus) + ' · ' + Utils.escapeHtml(u.taStatus) + '</div>' +
        '</div>' +
        '<div class="home-cards">' +
          '<div class="home-card" data-action="dynamic">' +
            '<div class="home-card-title">' + I18n.t('home.card.dynamic') + '</div>' +
            '<div class="home-card-desc">' + I18n.t('home.card.dynamic.desc') + '</div>' +
          '</div>' +
          '<div class="home-card" data-action="letter">' +
            '<div class="home-card-title">' + I18n.t('home.card.letter') + '</div>' +
            '<div class="home-card-desc">' + I18n.t('home.card.letter.desc') + '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    },
    mount: function (container) {
      container.querySelectorAll('.home-card').forEach(function(card){
        card.addEventListener('click', function(){
          Toast.info(card.dataset.action === 'dynamic' ? '动态模块将在 V0.6 开启' : '信件模块将在 V0.7 开启');
        });
      });
    }
  };

  function makePlaceholder(key, icon) {
    return { render: function(){ return '<div class="page"><div class="page-placeholder"><div class="placeholder-icon">'+getIcon(icon)+'</div><p class="placeholder-text">'+I18n.t(key)+' · '+I18n.t('page.soon')+'</p></div></div>'; } };
  }
  var ChatModule = makePlaceholder('nav.chat','chat');
  var CardsModule = makePlaceholder('nav.cards','cards');
  var ProfileModule = makePlaceholder('nav.profile','user');

  /* ================= App ================= */
  var NAV_ITEMS = [
    {id:'home', labelKey:'nav.home', icon:'home'},
    {id:'chat', labelKey:'nav.chat', icon:'chat'},
    {id:'cards', labelKey:'nav.cards', icon:'cards'},
    {id:'profile', labelKey:'nav.profile', icon:'user'}
  ];

  function applyTheme(t) {
    var r = t==='system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light') : t;
    document.documentElement.setAttribute('data-theme', r);
    State.theme = r;
    var m = document.querySelector('meta[name="theme-color"]');
    if(m) m.content = r==='dark'?'#121212':'#FAFAF7';
  }

  function renderBottomNav() {
    var n = document.getElementById('bottom-nav'); if(!n) return;
    n.innerHTML = NAV_ITEMS.map(function(i){
      return '<button class="nav-item" data-page="'+i.id+'"><span class="nav-icon">'+getIcon(i.icon)+'</span><span class="nav-label">'+I18n.t(i.labelKey)+'</span></button>';
    }).join('');
    n.querySelectorAll('.nav-item').forEach(function(b){
      b.addEventListener('click', function(){ Router.navigate(b.dataset.page); });
    });
  }

  function openEditProfile() {
    var u = State.user || defaultUser();
    Modal.open({
      title: I18n.t('edit.title'),
      content: '' +
        '<div class="input-group"><label>'+I18n.t('edit.myName')+'</label><input id="edit-myName" type="text" value="'+Utils.escapeHtml(u.myName)+'"></div>' +
        '<div class="input-group"><label>'+I18n.t('edit.taName')+'</label><input id="edit-taName" type="text" value="'+Utils.escapeHtml(u.taName)+'"></div>' +
        '<div class="input-group"><label>'+I18n.t('edit.status')+'</label><input id="edit-status" type="text" value="'+Utils.escapeHtml(u.myStatus)+'"></div>',
      actions: [
        { label: I18n.t('edit.cancel'), type: 'btn-secondary' },
        { label: I18n.t('edit.save'), type: 'btn-primary', onClick: function(){
          var myName = document.getElementById('edit-myName').value.trim() || '我的';
          var taName = document.getElementById('edit-taName').value.trim() || 'TA';
          var status = document.getElementById('edit-status').value.trim() || '在这里';
          State.user.myName = myName;
          State.user.taName = taName;
          State.user.myStatus = status;
          Storage.saveUser(State.user).then(function(){
            Toast.success('已保存');
            Router.navigate(State.currentPage);
          });
        }}
      ]
    });
  }

  function bindDebug() {
    var tBtn = document.getElementById('debug-theme');
    var lBtn = document.getElementById('debug-lang');
    var eBtn = document.getElementById('debug-edit');

    if(tBtn) tBtn.addEventListener('click', function(){
      var cur = State.settings.appearance.theme;
      var next = cur==='light'?'dark':(cur==='dark'?'system':'light');
      State.settings.appearance.theme = next;
      applyTheme(next);
      Storage.saveSettings(State.settings);
      Toast.info('主题：'+next);
    });
    if(lBtn) lBtn.addEventListener('click', function(){
      var list = I18n.available();
      var idx = list.indexOf(I18n.current);
      var next = list[(idx+1)%list.length];
      I18n.setLanguage(next);
      State.settings.language = next;
      Storage.saveSettings(State.settings);
      renderBottomNav();
      Router.navigate(State.currentPage);
      Toast.info('语言：'+next);
    });
    if(eBtn) eBtn.addEventListener('click', openEditProfile);
  }

  function bootstrap() {
    Database.open()
    .then(function(){ return Storage.getSettings(); })
    .then(function(s){ State.settings = s; return Storage.getUser(); })
    .then(function(u){
      State.user = u;
      I18n.setLanguage(State.settings.language||'zh');
      applyTheme(State.settings.appearance&&State.settings.appearance.theme||'system');
      Router.register('home', HomeModule);
      Router.register('chat', ChatModule);
      Router.register('cards', CardsModule);
      Router.register('profile', ProfileModule);
      renderBottomNav();
      bindDebug();
      Router.navigate('home');
      console.log('[信笺] V0.2 启动完成');
      setTimeout(function(){ Toast.success('信笺已就绪'); }, 300);
    })
    .catch(function(err){
      console.error('[信笺] 启动失败', err);
      Toast.error('启动失败：'+(err&&err.message||'未知错误'), 4000);
    });
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', bootstrap);
  else bootstrap();
})();
</script>
</body>
</html>
