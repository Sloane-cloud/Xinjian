<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FAFAF7">
<meta name="description" content="信笺 - 属于你的私人数字空间">
<title>信笺</title>
<style>
/* ========== base ========== */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 16px; line-height: 1.5; color: var(--color-text); background: var(--color-bg);
  -webkit-font-smoothing: antialiased; overscroll-behavior: none; transition: background 250ms ease, color 250ms ease;
}
#app { height: 100dvh; display: flex; flex-direction: column; }
button { font-family: inherit; font-size: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea { font-family: inherit; font-size: inherit; color: inherit; border: none; outline: none; background: transparent; resize: none; }
svg { display: block; }

/* ========== theme ========== */
:root {
  --color-bg: #FAFAF7; --color-surface: #FFFFFF; --color-surface-hover: #F5F5F2;
  --color-text: #1C1C1E; --color-text-secondary: #6E6E73; --color-text-tertiary: #AEAEB2;
  --color-border: #E8E8E3; --color-primary: #5B7B7A; --color-primary-light: #E8F0EF;
  --color-accent: #C9A8A2; --color-danger: #C75C5C; --color-success: #6B9E7C;
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-full: 999px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.03); --shadow-md: 0 2px 8px rgba(0,0,0,0.05);
  --space-xs: 4px; --space-sm: 8px; --space-md: 16px; --space-lg: 24px; --space-xl: 32px;
  --nav-height: 56px; --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  --transition-fast: 150ms ease; --transition-base: 250ms ease;
}
[data-theme="dark"] {
  --color-bg: #121212; --color-surface: #1C1C1E; --color-surface-hover: #2C2C2E;
  --color-text: #F2F2F7; --color-text-secondary: #98989F; --color-text-tertiary: #636366;
  --color-border: #2C2C2E; --color-primary: #7BA3A1; --color-primary-light: #1E2E2D;
  --color-accent: #D4B8B3; --shadow-sm: 0 1px 2px rgba(0,0,0,0.2); --shadow-md: 0 2px 8px rgba(0,0,0,0.3);
}

/* ========== layout ========== */
.page-container { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-top: var(--safe-top); padding-bottom: calc(var(--nav-height) + var(--safe-bottom)); }
.page { min-height: 100%; padding: var(--space-md); }
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; height: calc(var(--nav-height) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom); display: flex; align-items: stretch;
  background: var(--color-surface); border-top: 1px solid var(--color-border); z-index: 100;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--color-text-tertiary); transition: color var(--transition-fast); min-height: 44px; }
.nav-item.active { color: var(--color-primary); }
.nav-item:active { opacity: 0.7; }
.nav-icon svg { width: 22px; height: 22px; }
.nav-label { font-size: 11px; line-height: 1; }

/* ========== components ========== */
.btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 20px; border-radius: var(--radius-md); font-size: 15px; font-weight: 500; min-height: 44px; }
.btn:active { opacity: 0.85; }
.btn-primary { background: var(--color-primary); color: #fff; }
.btn-secondary { background: var(--color-surface-hover); color: var(--color-text); }
.btn-danger { background: var(--color-danger); color: #fff; }
.btn-text { background: none; color: var(--color-primary); padding: 8px 12px; min-height: auto; }
.btn-icon { padding: 8px; min-height: 44px; min-width: 44px; display: flex; align-items: center; justify-content: center; color: var(--color-text-secondary); }

.toast-root { position: fixed; bottom: calc(var(--nav-height) + var(--safe-bottom) + 24px); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 2000; pointer-events: none; }
.toast { background: rgba(0,0,0,0.85); color: #fff; padding: 10px 18px; border-radius: var(--radius-full); font-size: 14px; opacity: 0; transform: translateY(10px); transition: all 250ms ease; max-width: 80%; text-align: center; }
.toast.show { opacity: 1; transform: translateY(0); }
.toast-error { background: var(--color-danger); }
.toast-success { background: var(--color-success); }

.modal-root { position: fixed; inset: 0; pointer-events: none; z-index: 1500; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; padding: 24px; opacity: 0; transition: opacity 250ms ease; pointer-events: auto; }
.modal-overlay.show { opacity: 1; }
.modal { background: var(--color-surface); border-radius: var(--radius-lg); padding: 24px; width: 100%; max-width: 360px; transform: scale(0.95); transition: transform 250ms ease; box-shadow: var(--shadow-lg); }
.modal-overlay.show .modal { transform: scale(1); }
.modal-title { font-size: 17px; font-weight: 600; margin-bottom: 16px; text-align: center; }
.modal-body { margin-bottom: 20px; max-height: 60vh; overflow-y: auto; }
.modal-actions { display: flex; gap: 10px; }
.modal-actions .btn { flex: 1; }
.input-group { margin-bottom: 12px; }
.input-group label { display: block; font-size: 13px; color: var(--color-text-secondary); margin-bottom: 6px; }
.input-group input, .input-group textarea { width: 100%; padding: 10px 14px; background: var(--color-surface-hover); border-radius: var(--radius-md); font-size: 15px; }
.input-group textarea { min-height: 80px; }

/* ========== pages ========== */
.page-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; color: var(--color-text-secondary); gap: var(--space-md); text-align: center; }
.placeholder-icon { width: 48px; height: 48px; color: var(--color-text-tertiary); }
.placeholder-icon svg { width: 48px; height: 48px; }
.placeholder-text { font-size: 15px; color: var(--color-text-secondary); }

/* 首页 */
.home-page { display: flex; flex-direction: column; min-height: 80vh; padding-top: var(--space-xl); }
.home-profile-grid { display: flex; align-items: flex-start; justify-content: center; gap: var(--space-md); margin-bottom: var(--space-xl); padding: 0 var(--space-sm); }
.profile-column { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1; max-width: 120px; }
.home-avatar { width: 72px; height: 72px; border-radius: 50%; background: var(--color-surface-hover); display: flex; align-items: center; justify-content: center; overflow: hidden; border: 2px solid var(--color-border); }
.home-avatar svg { width: 36px; height: 36px; color: var(--color-text-tertiary); }
.home-heart { font-size: 22px; color: var(--color-accent); animation: breathe 3s ease-in-out infinite; margin-top: 26px; }
@keyframes breathe { 0%, 100% { opacity: 0.6; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.05); } }
.home-name { font-size: 15px; font-weight: 500; color: var(--color-text); text-align: center; word-break: break-all; }
.home-status { font-size: 12px; color: var(--color-text-secondary); text-align: center; word-break: break-all; }

.home-cards { display: flex; flex-direction: column; gap: var(--space-md); padding: 0 var(--space-md); }
.home-card { background: var(--color-surface); border-radius: var(--radius-lg); padding: var(--space-lg); box-shadow: var(--shadow-sm); border: 1px solid var(--color-border); transition: transform var(--transition-fast); }
.home-card:active { transform: scale(0.98); }
.home-card-title { font-size: 15px; font-weight: 600; color: var(--color-text); margin-bottom: 6px; }
.home-card-desc { font-size: 13px; color: var(--color-text-secondary); line-height: 1.5; }

/* 字卡库 */
.cards-page { padding: var(--space-md); }
.cards-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-md); }
.cards-title { font-size: 20px; font-weight: 600; }
.cards-list { display: flex; flex-direction: column; gap: var(--space-sm); }
.card-item { background: var(--color-surface); border-radius: var(--radius-md); padding: var(--space-md); border: 1px solid var(--color-border); display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-md); }
.card-item-content { flex: 1; }
.card-item-main { font-size: 15px; color: var(--color-text); margin-bottom: 4px; }
.card-item-sub { font-size: 12px; color: var(--color-text-secondary); }
.card-item-actions { display: flex; gap: var(--space-xs); }
.cards-empty { text-align: center; padding: var(--space-xl) 0; color: var(--color-text-tertiary); }

/* 聊天页 */
.chat-page { display: flex; flex-direction: column; height: calc(100dvh - var(--nav-height) - var(--safe-bottom)); padding: 0; }
.chat-header { display: flex; align-items: center; padding: var(--space-sm) var(--space-md); background: var(--color-surface); border-bottom: 1px solid var(--color-border); gap: var(--space-sm); }
.chat-header-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--color-surface-hover); display: flex; align-items: center; justify-content: center; }
.chat-header-avatar svg { width: 20px; height: 20px; color: var(--color-text-tertiary); }
.chat-header-info { flex: 1; display: flex; flex-direction: column; }
.chat-header-name { font-size: 15px; font-weight: 600; }
.chat-header-status { font-size: 11px; color: var(--color-text-secondary); }
.chat-header-settings { padding: 8px; color: var(--color-text-tertiary); }
.chat-header-settings svg { width: 20px; height: 20px; }

.chat-messages { flex: 1; overflow-y: auto; padding: var(--space-md); display: flex; flex-direction: column; gap: var(--space-md); -webkit-overflow-scrolling: touch; }
.chat-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--color-text-tertiary); gap: var(--space-sm); }
.chat-empty svg { width: 48px; height: 48px; opacity: 0.5; }
.chat-empty-text { font-size: 14px; }

.msg-row { display: flex; flex-direction: column; max-width: 80%; }
.msg-row.me { align-self: flex-end; align-items: flex-end; }
.msg-row.ta { align-self: flex-start; align-items: flex-start; }
.msg-bubble { padding: 10px 14px; border-radius: var(--radius-lg); font-size: 15px; line-height: 1.5; word-break: break-word; box-shadow: var(--shadow-sm); }
.msg-row.me .msg-bubble { background: var(--color-primary); color: #fff; border-bottom-right-radius: 4px; }
.msg-row.ta .msg-bubble { background: var(--color-surface); color: var(--color-text); border-bottom-left-radius: 4px; border: 1px solid var(--color-border); }
.msg-time { font-size: 10px; color: var(--color-text-tertiary); margin-top: 4px; padding: 0 4px; }

.chat-input-area { padding: var(--space-sm) var(--space-md); background: var(--color-surface); border-top: 1px solid var(--color-border); display: flex; gap: var(--space-sm); align-items: flex-end; padding-bottom: calc(var(--space-sm) + var(--safe-bottom)); }
.chat-input { flex: 1; background: var(--color-surface-hover); border-radius: var(--radius-md); padding: 10px 14px; max-height: 120px; min-height: 44px; display: flex; align-items: center; }
.chat-input textarea { width: 100%; max-height: 100px; font-size: 15px; line-height: 1.4; }
.chat-send-btn { padding: 10px 16px; background: var(--color-primary); color: #fff; border-radius: var(--radius-md); font-size: 14px; font-weight: 500; height: 44px; display: flex; align-items: center; justify-content: center; }
.chat-send-btn:disabled { opacity: 0.5; }

/* 调试面板（仅首页底部显示） */
.debug-panel { display: flex; gap: var(--space-sm); justify-content: center; margin-top: var(--space-xl); margin-bottom: var(--space-lg); }
.debug-btn { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-full); padding: 8px 16px; font-size: 13px; color: var(--color-text-secondary); }
</style>
</head>

    user: { keyPath:'id' }, chatSettings: { keyPath:'id' }, settings: { keyPath:'id' }, security: { keyPath:'id' },
    chatMessages: { keyPath:'id', indexes:[{name:'timestamp',keyPath:'timestamp'}] },
    cardGroups: { keyPath:'id' }, cards: { keyPath:'id', indexes:[{name:'lastUsedAt', keyPath:'lastUsedAt'}] }, replyRules: { keyPath:'id' },
    dynamics: { keyPath:'id' }, letters: { keyPath:'id' }, music: { keyPath:'id' },
    translationCache: { keyPath:'id' }, backups: { keyPath:'id' }, favorites: { keyPath:'id' },
    drafts: { keyPath:'id' }, recentUsed: { keyPath:'id' }
  };
  var Database = {
    open: function () {
      if (dbInstance) return Promise.resolve(dbInstance);
      return new Promise(function(resolve,reject){
        if (!window.indexedDB) { reject(new Error('当前浏览器不支持 IndexedDB')); return; }
        var req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onerror = function(){ reject(req.error); };
        req.onsuccess = function(){
          dbInstance = req.result;
          dbInstance.onversionchange = function(){ dbInstance.close(); dbInstance=null; };
          resolve(dbInstance);
        };
        req.onupgradeneeded = function(e){
          var db = e.target.result;
          Object.keys(SCHEMA).forEach(function(n){
            var c = SCHEMA[n];
            if (!db.objectStoreNames.contains(n)) {
              var s = db.createObjectStore(n, { keyPath: c.keyPath });
              (c.indexes||[]).forEach(function(i){
                s.createIndex(i.name, i.keyPath, { unique:!!i.unique, multiEntry:!!i.multiEntry });
              });
            }
          });
        };
      });
    },
    get: function (s,k) { return this.open().then(function(db){ return new Promise(function(res,rej){ var tx=db.transaction(s,'readonly'); var r=tx.objectStore(s).get(k); r.onsuccess=function(){res(r.result);}; r.onerror=function(){rej(r.error);}; }); }); },
    put: function (s,v) { return this.open().then(function(db){ return new Promise(function(res,rej){ var tx=db.transaction(s,'readwrite'); var r=tx.objectStore(s).put(v); r.onsuccess=function(){res(r.result);}; r.onerror=function(){rej(r.error);}; }); }); },
    delete: function (s,k) { return this.open().then(function(db){ return new Promise(function(res,rej){ var tx=db.transaction(s,'readwrite'); var r=tx.objectStore(s).delete(k); r.onsuccess=function(){res();}; r.onerror=function(){rej(r.error);}; }); }); },
    getAll: function (s) { return this.open().then(function(db){ return new Promise(function(res,rej){ var tx=db.transaction(s,'readonly'); var r=tx.objectStore(s).getAll(); r.onsuccess=function(){res(r.result||[]);}; r.onerror=function(){rej(r.error);}; }); }); }
  };

  function defaultSettings() {
    return { id:'settings', appearance:{ theme:'system', background:null, backgroundOpacity:1, backgroundBlur:0 }, language:'zh', notifications:{message:false,activeMessage:false}, features:{music:true,dynamic:true,letters:true}, animations:{enabled:true}, splash:{enabled:false,type:'fade',speed:'normal'}, updatedAt:Date.now() };
  }
  function defaultUser() {
    return { id:'main', myName:'我的', taName:'TA', myStatus:'在这里', taStatus:'在这里', myAvatar:null, taAvatar:null, background:null, updatedAt:Date.now() };
  }
  var Storage = {
    getSettings: function () { return Database.get('settings','settings').then(function(s){ return s||defaultSettings(); }); },
    saveSettings: function (s) { s.id='settings'; s.updatedAt=Date.now(); return Database.put('settings',s).then(function(){return s;}); },
    getUser: function () { return Database.get('user','main').then(function(u){ return u||defaultUser(); }); },
    saveUser: function (u) { u.id='main'; u.updatedAt=Date.now(); return Database.put('user',u).then(function(){return u;}); }
  };

  var State = { currentPage:'home', user:null, settings:null, chatMessages:[], cards:[], theme:'light' };

  var Router = {
    routes:{}, current:null,
    register: function(n,m){ this.routes[n]=m; },
    navigate: function(n,p){
      p = p||{}; var mod=this.routes[n]; if(!mod) return;
      var c=document.getElementById('page-container'); if(!c) return;
      c.innerHTML = typeof mod.render==='function' ? mod.render(p) : ''; c.scrollTop=0;
      if (typeof mod.mount==='function') mod.mount(c,p);
      this.current=n; State.currentPage=n; this.updateNav(n);
    },
    updateNav: function(a){
      var nav=document.getElementById('bottom-nav'); if(!nav) return;
      var items=nav.querySelectorAll('.nav-item');
      for(var i=0;i<items.length;i++) items[i].classList.toggle('active', items[i].dataset.page===a);
    }
  };

  /* ========== Home Module ========== */
  var HomeModule = {
    render: function () {
      var u = State.user || defaultUser();
      return '' +
      '<div class="page home-page">' +
        '<div class="home-profile-grid">' +
          '<div class="profile-column">' +
            '<div class="home-avatar">' + getIcon('user') + '</div>' +
            '<div class="home-name">' + Utils.escapeHtml(u.myName) + '</div>' +
            '<div class="home-status">' + Utils.escapeHtml(u.myStatus) + '</div>' +
          '</div>' +
          '<div class="home-heart">♡</div>' +
          '<div class="profile-column">' +
            '<div class="home-avatar">' + getIcon('user') + '</div>' +
            '<div class="home-name">' + Utils.escapeHtml(u.taName) + '</div>' +
            '<div class="home-status">' + Utils.escapeHtml(u.taStatus) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="home-cards">' +
          '<div class="home-card" data-action="dynamic">' +
            '<div class="home-card-title">' + I18n.t('home.card.dynamic') + '</div>' +
            '<div class="home-card-desc">' + I18n.t('home.card.dynamic.desc') + '</div>' +
          '</div>' +
          '<div class="home-card" data-action="letter">' +
            '<div class="home-card-title">' + I18n.t('home.card.letter') + '</div>' +
            '<div class="home-card-desc">' + I18n.t('home.card.letter.desc') + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="debug-panel">' +
          '<button class="debug-btn" id="debug-theme">主题</button>' +
          '<button class="debug-btn" id="debug-lang">语言</button>' +
          '<button class="debug-btn" id="debug-edit">编辑资料</button>' +
        '</div>' +
      '</div>';
    },
    mount: function (container) {
      container.querySelectorAll('.home-card').forEach(function(card){
        card.addEventListener('click', function(){
          Toast.info(card.dataset.action === 'dynamic' ? '动态模块将在 V0.6 开启' : '信件模块将在 V0.7 开启');
        });
      });

      // 绑定首页底部的调试按钮
      var tBtn = document.getElementById('debug-theme');
      var lBtn = document.getElementById('debug-lang');
      var eBtn = document.getElementById('debug-edit');

      if(tBtn) tBtn.addEventListener('click', function(){
        var cur = State.settings.appearance.theme;
        var next = cur==='light'?'dark':(cur==='dark'?'system':'light');
        State.settings.appearance.theme = next;
        applyTheme(next);
        Storage.saveSettings(State.settings);
        Router.navigate('home');
        Toast.info('主题已切换：'+next);
      });
      if(lBtn) lBtn.addEventListener('click', function(){
        var list = I18n.available();
        var idx = list.indexOf(I18n.current);
        var next = list[(idx+1)%list.length];
        I18n.setLanguage(next);
        State.settings.language = next;
        Storage.saveSettings(State.settings);
        renderBottomNav();
        Router.navigate('home');
        Toast.info('语言已切换：'+next);
      });
      if(eBtn) eBtn.addEventListener('click', openEditProfile);
    }
  };

  /* ========== Cards Module ========== */
  var CardsModule = {
    render: function () {
      var cards = State.cards || [];
      var html = '<div class="page cards-page">' +
        '<div class="cards-header">' +
          '<div class="cards-title">' + I18n.t('cards.title') + '</div>' +
          '<button class="btn-icon" id="cards-add-btn">' + getIcon('add') + '</button>' +
        '</div>';

      if (cards.length === 0) {
        html += '<div class="cards-empty">' + I18n.t('cards.empty') + '</div>';
      } else {
        html += '<div class="cards-list">';
        cards.forEach(function(c){
          var mainText = c.zh || c.en || c.es || '...';
          html += '<div class="card-item" data-id="' + c.id + '">' +
            '<div class="card-item-content">' +
              '<div class="card-item-main">' + Utils.escapeHtml(mainText) + '</div>' +
              (c.group ? '<div class="card-item-sub">' + Utils.escapeHtml(c.group) + '</div>' : '') +
            '</div>' +
            '<div class="card-item-actions">' +
              '<button class="btn-icon card-edit-btn" data-id="' + c.id + '">' + getIcon('edit') + '</button>' +
              '<button class="btn-icon card-delete-btn" data-id="' + c.id + '">' + getIcon('trash') + '</button>' +
            '</div>' +
          '</div>';
        });
        html += '</div>';
      }
      html += '</div>';
      return html;
    },
    mount: function (container) {
      var self = this;
      var addBtn = document.getElementById('cards-add-btn');
      if (addBtn) addBtn.addEventListener('click', function(){ self.openEditor(); });

      container.querySelectorAll('.card-edit-btn').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.stopPropagation();
          var id = btn.dataset.id;
          var card = State.cards.find(function(c){ return c.id === id; });
          if (card) self.openEditor(card);
        });
      });

      container.querySelectorAll('.card-delete-btn').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.stopPropagation();
          var id = btn.dataset.id;
          Modal.open({
            title: I18n.t('cards.delete'),
            content: I18n.t('cards.delete.confirm'),
            actions: [
              { label: I18n.t('edit.cancel'), type: 'btn-secondary' },
              { label: I18n.t('cards.delete'), type: 'btn-danger', onClick: function(){
                Database.delete('cards', id).then(function(){
                  State.cards = State.cards.filter(function(c){ return c.id !== id; });
                  Toast.success('已删除');
                  Router.navigate('cards');
                });
              }}
            ]
          });
        });
      });
    },
    openEditor: function (card) {
      var isEdit = !!card;
      card = card || { id: Utils.generateId('card_'), zh:'', en:'', es:'', group:'' };
      Modal.open({
        title: isEdit ? I18n.t('cards.edit') : I18n.t('cards.add'),
        content: '' +
          '<div class="input-group"><label>'+I18n.t('cards.zh')+'</label><input id="card-zh" type="text" value="'+Utils.escapeHtml(card.zh)+'"></div>' +
          '<div class="input-group"><label>'+I18n.t('cards.en')+'</label><input id="card-en" type="text" value="'+Utils.escapeHtml(card.en)+'"></div>' +
          '<div class="input-group"><label>'+I18n.t('cards.es')+'</label><input id="card-es" type="text" value="'+Utils.escapeHtml(card.es)+'"></div>' +
          '<div class="input-group"><label>'+I18n.t('cards.group')+'</label><input id="card-group" type="text" value="'+Utils.escapeHtml(card.group)+'"></div>',
        actions: [
          { label: I18n.t('edit.cancel'), type: 'btn-secondary' },
          { label: I18n.t('cards.save'), type: 'btn-primary', onClick: function(){
            var zh = document.getElementById('card-zh').value.trim();
            var en = document.getElementById('card-en').value.trim();
            var es = document.getElementById('card-es').value.trim();
            var group = document.getElementById('card-group').value.trim();
            if (!zh && !en && !es) { Toast.error('至少填写一种语言的内容'); return; }
            card.zh = zh; card.en = en; card.es = es; card.group = group;
            card.updatedAt = Date.now();
            card.lastUsedAt = card.lastUsedAt || 0;
            Database.put('cards', card).then(function(){
              Toast.success('已保存');
              Database.getAll('cards').then(function(list){
                State.cards = list.sort(function(a,b){ return (b.lastUsedAt||0) - (a.lastUsedAt||0); });
                Router.navigate('cards');
              });
            });
          }}
        ]
      });
    }
  };

  /* ========== Chat Module ========== */
  var ChatModule = {
    replyTimeout: null,
    render: function () {
      var u = State.user || defaultUser();
      var messages = State.chatMessages || [];
      var html = '' +
      '<div class="chat-page">' +
        '<div class="chat-header">' +
          '<div class="chat-header-avatar">' + getIcon('user') + '</div>' +
          '<div class="chat-header-info">' +
            '<div class="chat-header-name">' + Utils.escapeHtml(u.taName) + '</div>' +
            '<div class="chat-header-status" id="chat-header-status">' + Utils.escapeHtml(u.taStatus) + '</div>' +
          '</div>' +
          '<button class="chat-header-settings" id="chat-settings-btn">' + getIcon('settings') + '</button>' +
        '</div>' +
        '<div class="chat-messages" id="chat-messages">';

      if (messages.length === 0) {
        html += '<div class="chat-empty">' + getIcon('emptyChat') + '<div class="chat-empty-text">' + I18n.t('chat.empty') + '</div></div>';
      } else {
        messages.forEach(function(msg){
          var isMe = msg.sender === 'me';
          html += '<div class="msg-row ' + (isMe ? 'me' : 'ta') + '">' +
            '<div class="msg-bubble">' + Utils.escapeHtml(msg.content) + '</div>' +
            '<div class="msg-time">' + Utils.formatTime(msg.timestamp) + '</div>' +
          '</div>';
        });
      }

      html += '</div>' +
        '<div class="chat-input-area">' +
          '<div class="chat-input"><textarea id="chat-input-field" rows="1" placeholder="' + I18n.t('chat.empty') + '"></textarea></div>' +
          '<button class="chat-send-btn" id="chat-send-btn">' + I18n.t('chat.send') + '</button>' +
        '</div>' +
      '</div>';
      return html;
    },
    mount: function (container) {
      var self = this;
      var inputField = document.getElementById('chat-input-field');
      var sendBtn = document.getElementById('chat-send-btn');
      var messagesContainer = document.getElementById('chat-messages');
      var statusEl = document.getElementById('chat-header-status');
      var settingsBtn = document.getElementById('chat-settings-btn');

      if (!inputField || !sendBtn) return;

      function scrollToBottom() {
        if (messagesContainer) messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }

      inputField.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 100) + 'px';
      });

      function appendMessage(msg) {
        var emptyEl = messagesContainer.querySelector('.chat-empty');
        if (emptyEl) emptyEl.remove();

        var isMe = msg.sender === 'me';
        var row = document.createElement('div');
        row.className = 'msg-row ' + (isMe ? 'me' : 'ta');
        row.innerHTML = '<div class="msg-bubble">' + Utils.escapeHtml(msg.content) + '</div><div class="msg-time">' + Utils.formatTime(msg.timestamp) + '</div>';
        messagesContainer.appendChild(row);
        scrollToBottom();
      }

      function sendMessage() {
        var text = inputField.value.trim();
        if (!text) return;

        var msg = {
          id: Utils.generateId('msg_'),
          sender: 'me',
          type: 'text',
          content: text,
          timestamp: Date.now(),
          deleted: false
        };

        inputField.value = '';
        inputField.style.height = 'auto';

        Database.put('chatMessages', msg).then(function() {
          State.chatMessages.push(msg);
          State.chatMessages.sort(function(a,b){ return a.timestamp - b.timestamp; });
          appendMessage(msg);

          self.triggerReply();
        }).catch(function(err){
          console.error(err);
          Toast.error('消息保存失败');
        });
      }

      sendBtn.addEventListener('click', sendMessage);
      inputField.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
      });

      if (settingsBtn) {
        settingsBtn.addEventListener('click', function() { Toast.info('聊天设置将在 V0.5 开启'); });
      }

      setTimeout(scrollToBottom, 100);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', scrollToBottom);
      }
    },
    triggerReply: function () {
      var self = this;
      if (State.cards.length === 0) {
        Toast.info('字卡库为空，去添加一张字卡吧');
        return;
      }

      var statusEl = document.getElementById('chat-header-status');
      if (statusEl) statusEl.textContent = I18n.t('chat.typing');

      var delay = 1000 + Math.random() * 2000;

      if (this.replyTimeout) clearTimeout(this.replyTimeout);
      this.replyTimeout = setTimeout(function () {
        var cards = State.cards;
        var randomIndex = Math.floor(Math.random() * cards.length);
        var card = cards[randomIndex];

        var replyText = card.zh || card.en || card.es || '...';

        var msg = {
          id: Utils.generateId('msg_'),
          sender: 'ta',
          type: 'text',
          content: replyText,
          timestamp: Date.now(),
          deleted: false
        };

        Database.put('chatMessages', msg).then(function () {
          State.chatMessages.push(msg);
          State.chatMessages.sort(function(a,b){ return a.timestamp - b.timestamp; });

          var messagesContainer = document.getElementById('chat-messages');
          if (messagesContainer) {
            var emptyEl = messagesContainer.querySelector('.chat-empty');
            if (emptyEl) emptyEl.remove();

            var row = document.createElement('div');
            row.className = 'msg-row ta';
            row.innerHTML = '<div class="msg-bubble">' + Utils.escapeHtml(msg.content) + '</div><div class="msg-time">' + Utils.formatTime(msg.timestamp) + '</div>';
            messagesContainer.appendChild(row);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
          }

          card.lastUsedAt = Date.now();
          Database.put('cards', card);

          if (statusEl) {
            var u = State.user || defaultUser();
            statusEl.textContent = u.taStatus;
          }
        });
      }, delay);
    }
  };

  function makePlaceholder(key, icon) {
    return { render: function(){ return '<div class="page"><div class="page-placeholder"><div class="placeholder-icon">'+getIcon(icon)+'</div><p class="placeholder-text">'+I18n.t(key)+' · '+I18n.t('page.soon')+'</p></div></div>'; } };
  }
  var ProfileModule = makePlaceholder('nav.profile','user');

  var NAV_ITEMS = [
    {id:'home', labelKey:'nav.home', icon:'home'},
    {id:'chat', labelKey:'nav.chat', icon:'chat'},
    {id:'cards', labelKey:'nav.cards', icon:'cards'},
    {id:'profile', labelKey:'nav.profile', icon:'user'}
  ];

  function applyTheme(t) {
    var r = t==='system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light') : t;
    document.documentElement.setAttribute('data-theme', r);
    State.theme = r;
    var m = document.querySelector('meta[name="theme-color"]');
    if(m) m.content = r==='dark'?'#121212':'#FAFAF7';
  }

  function renderBottomNav() {
    var n = document.getElementById('bottom-nav'); if(!n) return;
    n.innerHTML = NAV_ITEMS.map(function(i){
      return '<button class="nav-item" data-page="'+i.id+'"><span class="nav-icon">'+getIcon(i.icon)+'</span><span class="nav-label">'+I18n.t(i.labelKey)+'</span></button>';
    }).join('');
    n.querySelectorAll('.nav-item').forEach(function(b){
      b.addEventListener('click', function(){ Router.navigate(b.dataset.page); });
    });
  }

  function openEditProfile() {
    var u = State.user || defaultUser();
    Modal.open({
      title: I18n.t('edit.title'),
      content: '' +
        '<div class="input-group"><label>'+I18n.t('edit.myName')+'</label><input id="edit-myName" type="text" value="'+Utils.escapeHtml(u.myName)+'"></div>' +
        '<div class="input-group"><label>'+I18n.t('edit.myStatus')+'</label><input id="edit-myStatus" type="text" value="'+Utils.escapeHtml(u.myStatus)+'"></div>' +
        '<div class="input-group"><label>'+I18n.t('edit.taName')+'</label><input id="edit-taName" type="text" value="'+Utils.escapeHtml(u.taName)+'"></div>' +
        '<div class="input-group"><label>'+I18n.t('edit.taStatus')+'</label><input id="edit-taStatus" type="text" value="'+Utils.escapeHtml(u.taStatus)+'"></div>',
      actions: [
        { label: I18n.t('edit.cancel'), type: 'btn-secondary' },
        { label: I18n.t('edit.save'), type: 'btn-primary', onClick: function(){
          var myName = document.getElementById('edit-myName').value.trim() || '我的';
          var myStatus = document.getElementById('edit-myStatus').value.trim() || '在这里';
          var taName = document.getElementById('edit-taName').value.trim() || 'TA';
          var taStatus = document.getElementById('edit-taStatus').value.trim() || '在这里';
          State.user.myName = myName; State.user.myStatus = myStatus;
          State.user.taName = taName; State.user.taStatus = taStatus;
          Storage.saveUser(State.user).then(function(){
            Toast.success('已保存');
            Router.navigate('home');
          });
        }}
      ]
    });
  }

  function bootstrap() {
    Database.open()
    .then(function(){ return Storage.getSettings(); })
    .then(function(s){ State.settings = s; return Storage.getUser(); })
    .then(function(u){
      State.user = u;
      return Promise.all([Database.getAll('chatMessages'), Database.getAll('cards')]);
    })
    .then(function(results){
      State.chatMessages = (results[0] || []).sort(function(a,b){ return a.timestamp - b.timestamp; });
      State.cards = (results[1] || []).sort(function(a,b){ return (b.lastUsedAt||0) - (a.lastUsedAt||0); });

      I18n.setLanguage(State.settings.language||'zh');
      applyTheme(State.settings.appearance&&State.settings.appearance.theme||'system');
      Router.register('home', HomeModule);
      Router.register('chat', ChatModule);
      Router.register('cards', CardsModule);
      Router.register('profile', ProfileModule);
      renderBottomNav();
      Router.navigate('home');
      console.log('[信笺] V0.4.2 启动完成');
      setTimeout(function(){ Toast.success('信笺 V0.4.2 已就绪'); }, 300);
    })
    .catch(function(err){
      console.error('[信笺] 启动失败', err);
      Toast.error('启动失败：'+(err&&err.message||'未知错误'), 4000);
    });
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', bootstrap);
  else bootstrap();
})();
</script>
</body>
