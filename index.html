<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FAFAF7">
<meta name="description" content="信笺 - 属于你的私人数字空间">
<title>信笺</title>
<style>
/* ========== base ========== */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 16px; line-height: 1.5; color: var(--color-text); background: var(--color-bg);
  -webkit-font-smoothing: antialiased; overscroll-behavior: none; transition: background 250ms ease, color 250ms ease;
}
#app { height: 100dvh; display: flex; flex-direction: column; }
button { font-family: inherit; font-size: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; border: none; outline: none; background: transparent; resize: none; }
svg { display: block; }

/* ========== theme ========== */
:root {
  --color-bg: #FAFAF7; --color-surface: #FFFFFF; --color-surface-hover: #F5F5F2;
  --color-text: #1C1C1E; --color-text-secondary: #6E6E73; --color-text-tertiary: #AEAEB2;
  --color-border: #E8E8E3; --color-primary: #5B7B7A; --color-primary-light: #E8F0EF;
  --color-accent: #C9A8A2; --color-danger: #C75C5C; --color-success: #6B9E7C;
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-full: 999px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.03); --shadow-md: 0 2px 8px rgba(0,0,0,0.05); --shadow-lg: 0 8px 24px rgba(0,0,0,0.1);
  --space-xs: 4px; --space-sm: 8px; --space-md: 16px; --space-lg: 24px; --space-xl: 32px;
  --nav-height: 56px; --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  --transition-fast: 150ms ease; --transition-base: 250ms ease;
}
[data-theme="dark"] {
  --color-bg: #121212; --color-surface: #1C1C1E; --color-surface-hover: #2C2C2E;
  --color-text: #F2F2F7; --color-text-secondary: #98989F; --color-text-tertiary: #636366;
  --color-border: #2C2C2E; --color-primary: #7BA3A1; --color-primary-light: #1E2E2D;
  --color-accent: #D4B8B3; --shadow-sm: 0 1px 2px rgba(0,0,0,0.2); --shadow-md: 0 2px 8px rgba(0,0,0,0.3); --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
}

/* ========== layout ========== */
.page-container { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-top: var(--safe-top); padding-bottom: calc(var(--nav-height) + var(--safe-bottom)); }
.page { min-height: 100%; padding: var(--space-md); }
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; height: calc(var(--nav-height) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom); display: flex; align-items: stretch;
  background: var(--color-surface); border-top: 1px solid var(--color-border); z-index: 100;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--color-text-tertiary); transition: color var(--transition-fast); min-height: 44px; }
.nav-item.active { color: var(--color-primary); }
.nav-item:active { opacity: 0.7; }
.nav-icon svg { width: 22px; height: 22px; }
.nav-label { font-size: 11px; line-height: 1; }

/* ========== components ========== */
.btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 20px; border-radius: var(--radius-md); font-size: 15px; font-weight: 500; min-height: 44px; }
.btn:active { opacity: 0.85; }
.btn-primary { background: var(--color-primary); color: #fff; }
.btn-secondary { background: var(--color-surface-hover); color: var(--color-text); }
.btn-danger { background: var(--color-danger); color: #fff; }
.btn-text { background: none; color: var(--color-primary); padding: 8px 12px; min-height: auto; }
.btn-sm { padding: 6px 12px; font-size: 13px; min-height: 32px; border-radius: var(--radius-sm); }

.toast-root { position: fixed; bottom: calc(var(--nav-height) + var(--safe-bottom) + 24px); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 2000; pointer-events: none; }
.toast { background: rgba(0,0,0,0.85); color: #fff; padding: 10px 18px; border-radius: var(--radius-full); font-size: 14px; opacity: 0; transform: translateY(10px); transition: all 250ms ease; max-width: 80%; text-align: center; }
.toast.show { opacity: 1; transform: translateY(0); }
.toast-error { background: var(--color-danger); }
.toast-success { background: var(--color-success); }

.modal-root { position: fixed; inset: 0; pointer-events: none; z-index: 1500; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; transition: opacity 250ms ease; pointer-events: auto; }
.modal-overlay.show { opacity: 1; }
.modal { background: var(--color-surface); border-radius: var(--radius-lg); padding: 24px; width: 100%; max-width: 400px; transform: scale(0.95); transition: transform 250ms ease; box-shadow: var(--shadow-lg); max-height: 85vh; overflow-y: auto; }
.modal-overlay.show .modal { transform: scale(1); }
.modal-title { font-size: 17px; font-weight: 600; margin-bottom: 16px; text-align: center; }
.modal-body { margin-bottom: 20px; }
.modal-actions { display: flex; gap: 10px; margin-top: 10px; }
.modal-actions .btn { flex: 1; }
.input-group { margin-bottom: 12px; }
.input-group label { display: block; font-size: 13px; color: var(--color-text-secondary); margin-bottom: 4px; }
.input-group input, .input-group textarea, .input-group select { width: 100%; padding: 10px 14px; background: var(--color-surface-hover); border-radius: var(--radius-md); font-size: 15px; border: 1px solid transparent; }
.input-group input:focus, .input-group textarea:focus { border-color: var(--color-primary); }

/* ========== pages ========== */
.page-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; color: var(--color-text-secondary); gap: var(--space-md); text-align: center; }
.placeholder-icon { width: 48px; height: 48px; color: var(--color-text-tertiary); }
.placeholder-icon svg { width: 48px; height: 48px; }
.placeholder-text { font-size: 15px; color: var(--color-text-secondary); }

/* 首页 */
.home-page { display: flex; flex-direction: column; min-height: 80vh; padding-top: var(--space-xl); }
.home-profile-grid { display: flex; align-items: flex-start; justify-content: center; gap: var(--space-md); margin-bottom: var(--space-xl); padding: 0 var(--space-sm); }
.profile-column { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1; max-width: 120px; }
.home-avatar { width: 72px; height: 72px; border-radius: 50%; background: var(--color-surface-hover); display: flex; align-items: center; justify-content: center; overflow: hidden; border: 2px solid var(--color-border); }
.home-avatar svg { width: 36px; height: 36px; color: var(--color-text-tertiary); }
.home-heart { font-size: 22px; color: var(--color-accent); animation: breathe 3s ease-in-out infinite; margin-top: 26px; }
@keyframes breathe { 0%, 100% { opacity: 0.6; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.05); } }
.home-name { font-size: 15px; font-weight: 500; color: var(--color-text); text-align: center; word-break: break-all; }
.home-status { font-size: 12px; color: var(--color-text-secondary); text-align: center; word-break: break-all; }
.home-cards { display: flex; flex-direction: column; gap: var(--space-md); padding: 0 var(--space-md); }
.home-card { background: var(--color-surface); border-radius: var(--radius-lg); padding: var(--space-lg); box-shadow: var(--shadow-sm); border: 1px solid var(--color-border); transition: transform var(--transition-fast); }
.home-card:active { transform: scale(0.98); }
.home-card-title { font-size: 15px; font-weight: 600; color: var(--color-text); margin-bottom: 6px; }
.home-card-desc { font-size: 13px; color: var(--color-text-secondary); line-height: 1.5; }

/* 聊天页 */
.chat-page { display: flex; flex-direction: column; height: calc(100dvh - var(--nav-height) - var(--safe-bottom)); padding: 0; }
.chat-header { display: flex; align-items: center; padding: var(--space-sm) var(--space-md); background: var(--color-surface); border-bottom: 1px solid var(--color-border); gap: var(--space-sm); }
.chat-header-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--color-surface-hover); display: flex; align-items: center; justify-content: center; }
.chat-header-avatar svg { width: 20px; height: 20px; color: var(--color-text-tertiary); }
.chat-header-info { flex: 1; display: flex; flex-direction: column; }
.chat-header-name { font-size: 15px; font-weight: 600; }
.chat-header-status { font-size: 11px; color: var(--color-text-secondary); }
.chat-header-settings { padding: 8px; color: var(--color-text-tertiary); }
.chat-header-settings svg { width: 20px; height: 20px; }

.chat-messages { flex: 1; overflow-y: auto; padding: var(--space-md); display: flex; flex-direction: column; gap: var(--space-md); -webkit-overflow-scrolling: touch; }
.chat-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--color-text-tertiary); gap: var(--space-sm); }
.chat-empty svg { width: 48px; height: 48px; opacity: 0.5; }
.chat-empty-text { font-size: 14px; }

.msg-row { display: flex; flex-direction: column; max-width: 80%; }
.msg-row.me { align-self: flex-end; align-items: flex-end; }
.msg-row.ta { align-self: flex-start; align-items: flex-start; }
.msg-bubble { padding: 10px 14px; border-radius: var(--radius-lg); font-size: 15px; line-height: 1.5; word-break: break-word; box-shadow: var(--shadow-sm); }
.msg-row.me .msg-bubble { background: var(--color-primary); color: #fff; border-bottom-right-radius: 4px; }
.msg-row.ta .msg-bubble { background: var(--color-surface); color: var(--color-text); border-bottom-left-radius: 4px; border: 1px solid var(--color-border); }
.msg-time { font-size: 10px; color: var(--color-text-tertiary); margin-top: 4px; padding: 0 4px; }

.chat-input-area { padding: var(--space-sm) var(--space-md); background: var(--color-surface); border-top: 1px solid var(--color-border); display: flex; gap: var(--space-sm); align-items: flex-end; padding-bottom: calc(var(--space-sm) + var(--safe-bottom)); }
.chat-input { flex: 1; background: var(--color-surface-hover); border-radius: var(--radius-md); padding: 10px 14px; max-height: 120px; min-height: 44px; display: flex; align-items: center; }
.chat-input textarea { width: 100%; max-height: 100px; font-size: 15px; line-height: 1.4; }
.chat-send-btn { padding: 10px 16px; background: var(--color-primary); color: #fff; border-radius: var(--radius-md); font-size: 14px; font-weight: 500; height: 44px; display: flex; align-items: center; justify-content: center; }
.chat-send-btn:disabled { opacity: 0.5; }

/* 字卡库页 */
.cards-page { display: flex; flex-direction: column; min-height: 100%; padding-bottom: var(--space-xl); }
.cards-header { display: flex; align-items: center; gap: var(--space-sm); margin-bottom: var(--space-md); }
.cards-search { flex: 1; background: var(--color-surface-hover); border-radius: var(--radius-md); padding: 8px 14px; display: flex; align-items: center; }
.cards-search input { width: 100%; font-size: 14px; }
.cards-search svg { width: 18px; height: 18px; color: var(--color-text-tertiary); margin-right: 8px; }
.cards-list { display: flex; flex-direction: column; gap: var(--space-sm); }
.card-item { background: var(--color-surface); border-radius: var(--radius-md); padding: var(--space-md); border: 1px solid var(--color-border); display: flex; flex-direction: column; gap: 8px; position: relative; }
.card-item-content { font-size: 15px; color: var(--color-text); }
.card-item-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--color-text-secondary); }
.card-item-lang { display: flex; gap: 6px; }
.card-lang-tag { background: var(--color-primary-light); color: var(--color-primary); padding: 2px 8px; border-radius: var(--radius-full); font-size: 11px; }
.card-lang-tag.active { background: var(--color-primary); color: #fff; }
.card-item-actions { display: flex; gap: 8px; position: absolute; right: 12px; top: 12px; opacity: 0; transition: opacity var(--transition-fast); }
.card-item:hover .card-item-actions { opacity: 1; }
@media (max-width: 768px) { .card-item-actions { opacity: 1; position: static; justify-content: flex-end; margin-top: 4px; } }

.debug-panel { position: fixed; top: calc(var(--safe-top) + 8px); right: 8px; z-index: 500; display: flex; gap: 6px; }
.debug-btn { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-full); padding: 6px 12px; font-size: 12px; color: var(--color-text-secondary); }
</style>
</head>

    user: { keyPath:'id' }, chatSettings: { keyPath:'id' }, settings: { keyPath:'id' }, security: { keyPath:'id' },
    chatMessages: { keyPath:'id', indexes:[{name:'timestamp',keyPath:'timestamp'}] },

    open: function () {
      if (dbInstance) return Promise.resolve(dbInstance);
      return new Promise(function(resolve,reject){
        if (!window.indexedDB) { reject(new Error('当前浏览器不支持 IndexedDB')); return; }
        var req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onerror = function(){ reject(req.error); };
        req.onsuccess = function(){
          dbInstance = req.result;
          dbInstance.onversionchange = function(){ dbInstance.close(); dbInstance=null; };
          resolve(dbInstance);
        };
        req.onupgradeneeded = function(e){
          var db = e.target.result;
          Object.keys(SCHEMA).forEach(function(n){
            var c = SCHEMA[n];
            if (!db.objectStoreNames.contains(n)) {
              var s = db.createObjectStore(n, { keyPath: c.keyPath });
              (c.indexes||[]).forEach(function(i){
                s.createIndex(i.name, i.keyPath, { unique:!!i.unique, multiEntry:!!i.multiEntry });
              });
            }
          });
        };
      });
    },
    get: function (s,k) { return this.open().then(function(db){ return new Promise(function(res,rej){ var tx=db.transaction(s,'readonly'); var r=tx.objectStore(s).get(k); r.onsuccess=function(){res(r.result);}; r.onerror=function(){rej(r.error);}; }); }); },
    put: function (s,v) { return this.open().then(function(db){ return new Promise(function(res,rej){ var tx=db.transaction(s,'readwrite'); var r=tx.objectStore(s).put(v); r.onsuccess=function(){res(r.result);}; r.onerror=function(){rej(r.error);}; }); }); },
    delete: function (s,k) { return this.open().then(function(db){ return new Promise(function(res,rej){ var tx=db.transaction(s,'readwrite'); var r=tx.objectStore(s).delete(k); r.onsuccess=function(){res();}; r.onerror=function(){rej(r.error);}; }); }); },
    getAll: function (s) { return this.open().then(function(db){ return new Promise(function(res,rej){ var tx=db.transaction(s,'readonly'); var r=tx.objectStore(s).getAll(); r.onsuccess=function(){res(r.result||[]);}; r.onerror=function(){rej(r.error);}; }); }); }
  };

  /* ========== Reply Engine ========== */
  var ReplyEngine = {
    // 简单加权随机 + 防重复机制
    pickCard: function() {
      var cards = State.cards || [];
      if (cards.length === 0) return null;

      // 过滤掉最近使用过的字卡（最近5条内不重复）
      var recentIds = (State.chatMessages || [])
        .slice(-5)
        .filter(function(m){ return m.cardId; })
        .map(function(m){ return m.cardId; });

      var available = cards.filter(function(c){ return recentIds.indexOf(c.id) === -1; });
      if (available.length === 0) available = cards; // 如果都被过滤完了，降级为全部可用

      // 加权随机
      var totalWeight = 0;
      var weighted = available.map(function(c){
        var w = c.weight || 50;
        totalWeight += w;
        return { card: c, weight: w };
      });

      var r = Math.random() * totalWeight;
      var running = 0;
      for (var i = 0; i < weighted.length; i++) {
        running += weighted[i].weight;
        if (r <= running) return weighted[i].card;
      }
      return available[0];
    },

    // 生成回复内容（根据主语言选择）
    getContent: function(card) {
      var lang = card.mainLanguage || 'zh';
      if (lang === 'en' && card.content.en) return card.content.en;
      if (lang === 'es' && card.content.es) return card.content.es;
      return card.content.zh || '';
    },

    // 触发回复
    triggerReply: function() {
      var card = this.pickCard();
      if (!card) return; // 没有字卡就不回复

      var content = this.getContent(card);
      if (!content) return;

      // 模拟打字延迟 1.5 - 3 秒
      var delay = 1500 + Math.random() * 1500;

      setTimeout(function() {
        var msg = {
          id: Utils.generateId('msg_'),
          sender: 'ta',
          type: 'text',
          content: content,
          cardId: card.id,
          timestamp: Date.now(),
          deleted: false
        };

        Database.put('chatMessages', msg).then(function() {
          State.chatMessages.push(msg);
          State.chatMessages.sort(function(a,b){ return a.timestamp - b.timestamp; });

          // 如果当前在聊天页，直接更新 DOM
          if (State.currentPage === 'chat') {
            var messagesContainer = document.getElementById('chat-messages');
            if (messagesContainer) {
              var emptyEl = messagesContainer.querySelector('.chat-empty');
              if (emptyEl) emptyEl.remove();

              var row = document.createElement('div');
              row.className = 'msg-row ta';
              row.innerHTML = '<div class="msg-bubble">' + Utils.escapeHtml(msg.content) + '</div><div class="msg-time">' + Utils.formatTime(msg.timestamp) + '</div>';
              messagesContainer.appendChild(row);
              messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
          }

          // 更新字卡的最后使用时间
          card.lastUsedAt = Date.now();
          card.useCount = (card.useCount || 0) + 1;
          Database.put('cards', card);
        });
      }, delay);
    }
  };

            Router.navigate(State.currentPage);
          });
        }}
      ]
    });
  }

  function bindDebug() {
    var tBtn = document.getElementById('debug-theme');
    var lBtn = document.getElementById('debug-lang');
    var eBtn = document.getElementById('debug-edit');

    if(tBtn) tBtn.addEventListener('click', function(){
      var cur = State.settings.appearance.theme;
      var next = cur==='light'?'dark':(cur==='dark'?'system':'light');
      State.settings.appearance.theme = next;
      applyTheme(next);
      Storage.saveSettings(State.settings);
      Toast.info('主题：'+next);
    });
    if(lBtn) lBtn.addEventListener('click', function(){
      var list = I18n.available();
      var idx = list.indexOf(I18n.current);
      var next = list[(idx+1)%list.length];
      I18n.setLanguage(next);
      State.settings.language = next;
      Storage.saveSettings(State.settings);
      renderBottomNav();
      Router.navigate(State.currentPage);
      Toast.info('语言：'+next);
    });
    if(eBtn) eBtn.addEventListener('click', openEditProfile);
  }

  // 初始化默认字卡（如果为空）
  function initDefaultCards() {
    if (State.cards.length > 0) return Promise.resolve();
    var defaults = [
      { id: Utils.generateId('card_'), content: { zh: '你好呀，今天过得怎么样？', en: 'Hello, how was your day?', es: 'Hola, ¿cómo fue tu día?' }, mainLanguage: 'zh', weight: 50, useCount: 0, lastUsedAt: 0, createdAt: Date.now(), updatedAt: Date.now() },
      { id: Utils.generateId('card_'), content: { zh: '今天也要开心哦', en: 'Be happy today too', es: 'Sé feliz hoy también' }, mainLanguage: 'zh', weight: 50, useCount: 0, lastUsedAt: 0, createdAt: Date.now(), updatedAt: Date.now() },
      { id: Utils.generateId('card_'), content: { zh: '记得好好休息', en: 'Remember to rest well', es: 'Recuerda descansar bien' }, mainLanguage: 'zh', weight: 50, useCount: 0, lastUsedAt: 0, createdAt: Date.now(), updatedAt: Date.now() },
      { id: Utils.generateId('card_'), content: { zh: '晚安，做个好梦', en: 'Good night, sweet dreams', es: 'Buenas noches, dulces sueños' }, mainLanguage: 'zh', weight: 50, useCount: 0, lastUsedAt: 0, createdAt: Date.now(), updatedAt: Date.now() }
    ];
    return Promise.all(defaults.map(function(c){ return Database.put('cards', c); })).then(function(){
      State.cards = defaults;
      console.log('[信笺] 默认字卡已初始化');
    });
  }

  function bootstrap() {
    Database.open()
    .then(function(){ return Storage.getSettings(); })
    .then(function(s){ State.settings = s; return Storage.getUser(); })
    .then(function(u){
      State.user = u;
      return Promise.all([ Database.getAll('chatMessages'), Database.getAll('cards') ]);
    })
    .then(function(results){
      State.chatMessages = results[0] || [];
      State.chatMessages.sort(function(a,b){ return a.timestamp - b.timestamp; });
      State.cards = results[1] || [];

      // 初始化默认字卡
      return initDefaultCards();
    })
    .then(function(){
      I18n.setLanguage(State.settings.language||'zh');
      applyTheme(State.settings.appearance&&State.settings.appearance.theme||'system');
      Router.register('home', HomeModule);
      Router.register('chat', ChatModule);
      Router.register('cards', CardsModule);
      Router.register('profile', ProfileModule);
      renderBottomNav();
      bindDebug();
      Router.navigate('home');
      console.log('[信笺] V0.4 启动完成');
      setTimeout(function(){ Toast.success('信笺 V0.4 已就绪'); }, 300);
    })
    .catch(function(err){
      console.error('[信笺] 启动失败', err);
      Toast.error('启动失败：'+(err&&err.message||'未知错误'), 4000);
    });
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', bootstrap);
  else bootstrap();
})();
</script>
</body>
</html>
